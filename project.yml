name: Cue
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
options:
  bundleIdPrefix: dev.deoxy
  deploymentTarget:
    macOS: "26.0"
targets:
  Cue:
    type: application
    platform: macOS
    sources: [Cue]
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        # Stable self-signed identity so the Accessibility (TCC) grant survives
        # rebuilds — ad-hoc signing would mint a new identity every build.
        # CI builds pass CODE_SIGNING_ALLOWED=NO instead.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Cue Dev
      configs:
        # Separate dev bundle id + name keeps debug builds' TCC grants and data
        # isolated from the released app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deoxy.cue-dev
          PRODUCT_NAME: Cue (Dev)
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: dev.deoxy.cue
          PRODUCT_NAME: Cue
    info:
      path: Cue/Info.plist
      properties:
        # Menu bar app: no Dock icon, no main window.
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
