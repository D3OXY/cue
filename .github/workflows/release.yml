name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched by release-pr.yml after it tags a merged release PR.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodegen generate
          xcodebuild -project Cue.xcodeproj -scheme Cue -configuration Release \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Cue" \
            SYMROOT="$PWD/build" build

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "build/Release/Cue.app" "Cue-$VERSION.zip"

      - name: Sign update and build appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL=$(gh api repos/sparkle-project/Sparkle/releases/latest \
            --jq '.assets[] | select(.name | test("^Sparkle-[0-9.]+\\.tar\\.xz$")) | .browser_download_url')
          curl -fsSL "$URL" -o sparkle.tar.xz
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          echo "$SPARKLE_KEY" > ed.key
          SIG=$(./sparkle/bin/sign_update -f ed.key "Cue-$VERSION.zip")
          rm ed.key
          sh scripts/make_appcast.sh "$VERSION" "$SIG" > appcast.xml

      - name: Publish appcast to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pages && cp appcast.xml pages/
          cd pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -qm "appcast for $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes come from the changelog section for this version; fall back to
          # generated notes for tags cut without a changeset.
          awk "/^## v$VERSION /{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "Cue-$VERSION.zip" \
              --title "Cue $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "Cue-$VERSION.zip" \
              --title "Cue $VERSION" --generate-notes
          fi
